[project]
name = "greenwindow"
version = "0.1.0"
description = "Carbon-aware job scheduler: 48h GB grid carbon-intensity forecasts with honest uncertainty"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "statsmodels>=0.14",
    "pyyaml>=6",
    "holidays>=0.50",
    "scipy>=1.11",
]

[project.optional-dependencies]
chronos = [
    "chronos-forecasting>=2.0",
    "torch==2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenwindow"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real APIs (deselect with -m 'not live')"]

[tool.ruff.lint.per-file-ignores]
"scripts/feasibility_check.py" = ["E501"]
